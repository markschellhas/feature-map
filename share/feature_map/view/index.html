<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Map Viewer</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --surface: #fffcf8;
      --text: #1b1814;
      --muted: #5a554d;
      --border: #d4cec4;
      --accent: #1e4a78;
      --stale: #8a2424;
      --radius: 6px;
      --sidebar: 17rem;
      --grid: rgba(27, 24, 20, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151311;
        --surface: #1d1a17;
        --text: #f1ece5;
        --muted: #b6aea3;
        --border: #3c3832;
        --accent: #8fb3dc;
        --stale: #e08b8b;
        --grid: rgba(241, 236, 229, 0.08);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a.skip {
      position: absolute;
      left: -999px;
      top: 0;
    }

    a.skip:focus {
      left: 0.75rem;
      top: 0.75rem;
      z-index: 2;
      background: var(--surface);
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
    }

    #layout {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      min-height: 100vh;
    }

    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem 2rem;
    }

    #main {
      padding: 1.5rem 1.75rem 2.5rem;
      max-width: 64rem;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 650;
      margin: 0 0 1rem;
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 0.35rem;
    }

    h3 {
      font-size: 1rem;
      font-weight: 650;
      margin: 1.35rem 0 0.45rem;
    }

    .muted {
      color: var(--muted);
    }

    #empty {
      margin: 0;
      color: var(--muted);
    }

    .sidebar-search-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--muted);
      margin: 0 0 0.3rem;
    }

    #sidebar-search {
      display: block;
      width: 100%;
      margin: 0 0 0.85rem;
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }

    #sidebar-empty {
      margin: 0.35rem 0 0;
    }

    #slug-list {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .slug-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.45rem 0.6rem;
      font-weight: 600;
    }

    .slug-btn:hover {
      border-color: var(--border);
    }

    .slug-btn[aria-current="true"] {
      background: var(--bg);
      border-color: var(--border);
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    .graph-node:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .fields {
      margin: 0;
    }

    .fields > div {
      margin: 0 0 0.85rem;
    }

    .fields dt {
      font-weight: 650;
      margin: 0 0 0.2rem;
    }

    .fields dd {
      margin: 0;
    }

    ul, ol {
      margin: 0.15rem 0 0;
      padding-left: 1.2rem;
    }

    .stale {
      color: var(--stale);
    }

    .related {
      padding: 0;
      border-bottom: 1px solid var(--accent);
      border-radius: 0;
      color: var(--accent);
    }

    .related:hover {
      border-bottom-color: currentColor;
    }

    .diagram-canvas {
      position: relative;
      overflow: auto;
      background-color: var(--surface);
      background-image: radial-gradient(var(--grid) 1px, transparent 1px);
      background-size: 14px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 14rem;
      max-height: 32rem;
    }

    .diagram-canvas.mermaid-diagram {
      margin: 0.4rem 0 0.15rem;
      min-height: 0;
      max-height: none;
    }

    .diagram-canvas svg {
      display: block;
    }

    .graph-node {
      cursor: pointer;
    }

    .graph-node.passive {
      cursor: default;
    }

    .graph-node rect {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 1.5;
    }

    .graph-node.selected rect {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 2.25;
    }

    .graph-node.missing rect {
      fill: var(--surface);
      stroke-dasharray: 4 3;
    }

    .graph-node text {
      fill: var(--text);
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }

    .graph-edge {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.6;
    }

    .diagram-empty {
      margin: 0;
      padding: 1.25rem;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      #layout {
        grid-template-columns: 1fr;
      }

      #sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      #main {
        padding: 1.15rem 1rem 2rem;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to map</a>
  <div id="layout">
    <aside id="sidebar">
      <h1>Feature Map Viewer</h1>
      <label class="sidebar-search-label" for="sidebar-search">Search maps</label>
      <input id="sidebar-search" type="search" placeholder="Filter maps" autocomplete="off">
      <nav id="slug-list" aria-label="Feature maps"></nav>
      <p id="sidebar-empty" class="muted" hidden>No matching maps.</p>
    </aside>
    <main id="main">
      <p id="empty" hidden>No feature maps found in .features/.</p>
      <article id="detail" hidden>
        <h2 id="feature-heading" tabindex="-1"></h2>
        <p id="feature-slug" class="muted"></p>
        <dl id="fields" class="fields"></dl>
      </article>
      <section id="graph-panel" hidden>
        <h2>Graph</h2>
        <div id="graph-canvas" class="diagram-canvas" aria-label="Related features graph"></div>
      </section>
    </main>
  </div>
  <script>
    window.FEATURE_MAP = __VIEW_SNAPSHOT_JSON__;</script>
  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var diagramSeq = 0;
      var data = window.FEATURE_MAP || {};
      var emptyEl = document.getElementById("empty");
      var detailEl = document.getElementById("detail");
      var graphPanel = document.getElementById("graph-panel");
      var slugList = document.getElementById("slug-list");
      var searchEl = document.getElementById("sidebar-search");
      var searchLabel = document.querySelector(".sidebar-search-label");
      var sidebarEmpty = document.getElementById("sidebar-empty");
      var heading = document.getElementById("feature-heading");
      var slugLine = document.getElementById("feature-slug");
      var fieldsEl = document.getElementById("fields");
      var graphCanvas = document.getElementById("graph-canvas");

      function maps() {
        return data.maps || {};
      }

      function relatedSlug(entry) {
        if (typeof entry !== "string") return "";
        var match = entry.trim().match(/^["']?([a-zA-Z0-9_-]+)/);
        if (!match) return "";
        return match[1].toLowerCase().replace(/ /g, "_").replace(/-/g, "_");
      }

      function labelFor(key) {
        return String(key).replace(/_/g, " ");
      }

      function isStale(map, path) {
        var stale = map && map.stale_paths ? map.stale_paths : [];
        var i;
        for (i = 0; i < stale.length; i += 1) {
          if (stale[i] === path) return true;
        }
        return false;
      }

      function looksLikeMermaid(text) {
        var lines = String(text || "").split(/\n/);
        var i;
        var line;
        for (i = 0; i < lines.length; i += 1) {
          line = lines[i].replace(/^\s+/, "").replace(/\s+$/, "");
          if (!line || line.indexOf("%%") === 0) continue;
          return /^(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram(?:-v2)?|erDiagram|gantt|pie|mindmap|journey|gitGraph)\b/.test(line);
        }
        return false;
      }

      function mermaidFences(text) {
        var blocks = [];
        var re = /```mermaid\s*([\s\S]*?)```/gi;
        var match;
        while ((match = re.exec(text))) {
          if (match[1] && match[1].replace(/^\s+|\s+$/g, "")) {
            blocks.push(match[1].replace(/^\s+|\s+$/g, ""));
          }
        }
        return blocks;
      }

      function mermaidSources(text) {
        var fences = mermaidFences(text);
        if (fences.length) return fences;
        if (looksLikeMermaid(text)) return [String(text).replace(/^\s+|\s+$/g, "")];
        return [];
      }

      function proseWithoutMermaid(text) {
        var stripped = String(text || "").replace(/```mermaid\s*[\s\S]*?```/gi, "");
        if (looksLikeMermaid(text) && !mermaidFences(text).length) return "";
        return stripped.replace(/^\s+|\s+$/g, "");
      }

      function parseNodeToken(token) {
        var raw = String(token || "").replace(/\|[^|]*\|/g, "").replace(/^\s+|\s+$/g, "");
        var match = raw.match(/^([A-Za-z][A-Za-z0-9_]*)\s*\[\s*"?([^\]"]*?)"?\s*\]$/);
        if (match) return { id: match[1], label: match[2] };
        match = raw.match(/^([A-Za-z][A-Za-z0-9_]*)\s*\(\s*"?([^)"]*?)"?\s*\)$/);
        if (match) return { id: match[1], label: match[2] };
        match = raw.match(/^([A-Za-z][A-Za-z0-9_]*)\s*\{\s*"?([^}"]*?)"?\s*\}$/);
        if (match) return { id: match[1], label: match[2] };
        match = raw.match(/^([A-Za-z][A-Za-z0-9_]*)$/);
        if (match) return { id: match[1], label: match[1] };
        var id = raw.replace(/[^A-Za-z0-9_]/g, "_") || "node";
        if (/^[0-9]/.test(id)) id = "n_" + id;
        return { id: id, label: raw || id };
      }

      function parseMermaid(source) {
        var result = { direction: "LR", nodes: [], edges: [] };
        var nodeMap = {};
        function ensure(id, label) {
          if (!nodeMap[id]) {
            nodeMap[id] = { id: id, label: label || id };
            result.nodes.push(nodeMap[id]);
          } else if (label && label !== id) {
            nodeMap[id].label = label;
          }
          return nodeMap[id];
        }
        var lines = String(source || "").split(/\n/);
        var i;
        var line;
        var header;
        var edge;
        var left;
        var right;
        var standalone;
        for (i = 0; i < lines.length; i += 1) {
          line = lines[i].replace(/%%.*/, "").replace(/^\s+|\s+$/g, "");
          if (!line) continue;
          header = line.match(/^(?:graph|flowchart)\s+(LR|RL|TD|TB|BT)\b/i);
          if (header) {
            result.direction = header[1].toUpperCase() === "TB" ? "TD" : header[1].toUpperCase();
            continue;
          }
          if (/^(graph|flowchart)\b/i.test(line)) continue;
          if (/^(sequenceDiagram|classDiagram|stateDiagram(?:-v2)?|erDiagram|gantt|pie|mindmap|journey|gitGraph)\b/.test(line)) {
            continue;
          }
          edge = line.match(/^(.+?)\s*(-->|---|==>|-.->)\s*(.+)$/);
          if (edge) {
            left = parseNodeToken(edge[1]);
            right = parseNodeToken(edge[3]);
            ensure(left.id, left.label);
            ensure(right.id, right.label);
            result.edges.push({ from: left.id, to: right.id });
            continue;
          }
          standalone = parseNodeToken(line);
          if (standalone && /^[A-Za-z][A-Za-z0-9_]*$/.test(standalone.id) && line.indexOf(" ") === -1) {
            ensure(standalone.id, standalone.label);
          }
        }
        return result;
      }

      function svgEl(name, attrs) {
        var el = document.createElementNS(NS, name);
        Object.keys(attrs || {}).forEach(function (key) {
          el.setAttribute(key, attrs[key]);
        });
        return el;
      }

      function measureLabel(label) {
        var text = String(label || "");
        var width = Math.max(96, Math.round(22 + text.length * 7.2));
        return { width: Math.min(width, 220), height: 38 };
      }

      function connectedComponents(nodes, edges) {
        var ids = nodes.map(function (node) { return node.id; });
        var parent = {};
        ids.forEach(function (id) { parent[id] = id; });
        function find(id) {
          if (parent[id] !== id) parent[id] = find(parent[id]);
          return parent[id];
        }
        function union(a, b) {
          var pa = find(a);
          var pb = find(b);
          if (pa !== pb) parent[pa] = pb;
        }
        edges.forEach(function (edge) {
          if (parent[edge.from] != null && parent[edge.to] != null) {
            union(edge.from, edge.to);
          }
        });
        var groups = {};
        ids.forEach(function (id) {
          var root = find(id);
          if (!groups[root]) groups[root] = [];
          groups[root].push(id);
        });
        return Object.keys(groups).map(function (key) { return groups[key]; });
      }

      function layoutGraph(graph, compact) {
        var nodes = graph.nodes || [];
        var edges = graph.edges || [];
        var direction = graph.direction || "LR";
        var vertical = direction === "TD" || direction === "BT";
        var reverse = direction === "RL" || direction === "BT";
        var byId = {};
        nodes.forEach(function (node) {
          byId[node.id] = node;
          node._size = measureLabel(node.label);
        });
        var outgoing = {};
        var incoming = {};
        nodes.forEach(function (node) {
          outgoing[node.id] = [];
          incoming[node.id] = [];
        });
        edges.forEach(function (edge) {
          if (!byId[edge.from] || !byId[edge.to]) return;
          outgoing[edge.from].push(edge.to);
          incoming[edge.to].push(edge.from);
        });

        var placed = {};
        var pad = compact ? 20 : 32;
        var rankGap = compact ? 56 : 80;
        var siblingGap = compact ? 22 : 28;
        var cursorY = pad;
        var maxX = 0;
        var maxY = 0;

        connectedComponents(nodes, edges).forEach(function (ids) {
          var rank = {};
          var roots = ids.filter(function (id) { return incoming[id].length === 0; });
          if (!roots.length) roots = [ids.slice().sort()[0]];
          var queue = [];
          roots.forEach(function (id) {
            rank[id] = 0;
            queue.push(id);
          });
          while (queue.length) {
            var current = queue.shift();
            outgoing[current].forEach(function (next) {
              if (rank[next] == null) {
                rank[next] = rank[current] + 1;
                queue.push(next);
              }
            });
          }
          ids.forEach(function (id) {
            if (rank[id] == null) rank[id] = 0;
          });

          var layers = {};
          var maxRank = 0;
          ids.forEach(function (id) {
            maxRank = Math.max(maxRank, rank[id]);
            if (!layers[rank[id]]) layers[rank[id]] = [];
            layers[rank[id]].push(id);
          });
          Object.keys(layers).forEach(function (key) {
            layers[key].sort();
          });

          var ranks = [];
          var r;
          for (r = 0; r <= maxRank; r += 1) ranks.push(r);
          if (reverse) ranks.reverse();

          if (vertical) {
            var y = cursorY;
            ranks.forEach(function (layerRank) {
              var layer = layers[layerRank] || [];
              var layerHeight = 0;
              var x = pad;
              layer.forEach(function (id) {
                var size = byId[id]._size;
                placed[id] = { x: x, y: y, width: size.width, height: size.height };
                x += size.width + siblingGap;
                layerHeight = Math.max(layerHeight, size.height);
                maxX = Math.max(maxX, placed[id].x + size.width);
                maxY = Math.max(maxY, placed[id].y + size.height);
              });
              y += layerHeight + rankGap;
            });
            cursorY = maxY + pad;
          } else {
            var xCol = pad;
            var bottom = cursorY;
            ranks.forEach(function (layerRank) {
              var layer = layers[layerRank] || [];
              var colWidth = 0;
              layer.forEach(function (id) {
                colWidth = Math.max(colWidth, byId[id]._size.width);
              });
              var y = cursorY;
              layer.forEach(function (id) {
                var size = byId[id]._size;
                placed[id] = {
                  x: xCol + Math.round((colWidth - size.width) / 2),
                  y: y,
                  width: size.width,
                  height: size.height
                };
                y += size.height + siblingGap;
                maxX = Math.max(maxX, placed[id].x + size.width);
                maxY = Math.max(maxY, placed[id].y + size.height);
              });
              xCol += colWidth + rankGap;
              bottom = Math.max(bottom, y);
            });
            cursorY = bottom + pad;
          }
        });

        return {
          placed: placed,
          width: compact ? Math.max(maxX + pad, 1) : Math.max(maxX + pad, 320),
          height: compact ? Math.max(maxY + pad, 1) : Math.max(maxY + pad, 220),
          vertical: vertical
        };
      }

      function edgeAnchor(box, toward, vertical) {
        if (vertical) {
          if (toward.y >= box.y + box.height / 2) {
            return { x: box.x + box.width / 2, y: box.y + box.height };
          }
          return { x: box.x + box.width / 2, y: box.y };
        }
        if (toward.x >= box.x + box.width / 2) {
          return { x: box.x + box.width, y: box.y + box.height / 2 };
        }
        return { x: box.x, y: box.y + box.height / 2 };
      }

      function renderDiagram(container, graph, options) {
        while (container.firstChild) container.removeChild(container.firstChild);
        options = options || {};
        var nodes = graph.nodes || [];
        var edges = graph.edges || [];
        if (!nodes.length) {
          var empty = document.createElement("p");
          empty.className = "diagram-empty";
          empty.textContent = "No graph nodes.";
          container.appendChild(empty);
          return;
        }
        var layout = layoutGraph(graph, options.compact);
        var svg = svgEl("svg", {
          viewBox: "0 0 " + layout.width + " " + layout.height,
          width: String(layout.width),
          height: String(layout.height),
          role: "img"
        });
        diagramSeq += 1;
        var markerId = "arrow-" + diagramSeq;
        var defs = svgEl("defs");
        var marker = svgEl("marker", {
          id: markerId,
          viewBox: "0 0 10 10",
          refX: "9",
          refY: "5",
          markerWidth: "7",
          markerHeight: "7",
          orient: "auto-start-reverse"
        });
        marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "currentColor" }));
        defs.appendChild(marker);
        svg.appendChild(defs);

        edges.forEach(function (edge) {
          var from = layout.placed[edge.from];
          var to = layout.placed[edge.to];
          if (!from || !to) return;
          var start = edgeAnchor(from, { x: to.x + to.width / 2, y: to.y + to.height / 2 }, layout.vertical);
          var end = edgeAnchor(to, { x: from.x + from.width / 2, y: from.y + from.height / 2 }, layout.vertical);
          var dx = Math.max(36, Math.abs(end.x - start.x) / 2);
          var dy = Math.max(24, Math.abs(end.y - start.y) / 2);
          var d;
          if (layout.vertical) {
            d = "M " + start.x + " " + start.y + " C " + start.x + " " + (start.y + dy) + ", " + end.x + " " + (end.y - dy) + ", " + end.x + " " + end.y;
          } else if (end.x >= start.x) {
            d = "M " + start.x + " " + start.y + " C " + (start.x + dx) + " " + start.y + ", " + (end.x - dx) + " " + end.y + ", " + end.x + " " + end.y;
          } else {
            d = "M " + start.x + " " + start.y + " C " + (start.x + 48) + " " + (start.y - 42) + ", " + (end.x - 48) + " " + (end.y - 42) + ", " + end.x + " " + end.y;
          }
          var path = svgEl("path", {
            d: d,
            "class": "graph-edge",
            "marker-end": "url(#" + markerId + ")"
          });
          svg.appendChild(path);
        });

        nodes.forEach(function (node) {
          var box = layout.placed[node.id];
          if (!box) return;
          var group = svgEl("g", { "class": "graph-node" });
          if (node.missing) group.setAttribute("class", "graph-node missing passive");
          if (options.selected && options.selected === node.id) {
            group.setAttribute("class", (group.getAttribute("class") || "graph-node") + " selected");
          }
          group.setAttribute("tabindex", node.missing ? "-1" : "0");
          group.setAttribute("role", node.missing ? "img" : "button");
          group.setAttribute("aria-label", node.label);
          group.appendChild(svgEl("rect", {
            x: String(box.x),
            y: String(box.y),
            width: String(box.width),
            height: String(box.height),
            rx: "8",
            ry: "8"
          }));
          var text = svgEl("text", {
            x: String(box.x + box.width / 2),
            y: String(box.y + box.height / 2 + 4),
            "text-anchor": "middle"
          });
          text.textContent = node.label;
          group.appendChild(text);
          if (!node.missing && typeof options.onNodeClick === "function") {
            group.addEventListener("click", function () {
              options.onNodeClick(node.id);
            });
            group.addEventListener("keydown", function (event) {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                options.onNodeClick(node.id);
              }
            });
          }
          svg.appendChild(group);
        });
        container.appendChild(svg);
      }

      function appendMermaid(parent, source) {
        var canvas = document.createElement("div");
        canvas.className = "diagram-canvas mermaid-diagram";
        canvas.setAttribute("aria-label", "Mermaid diagram");
        parent.appendChild(canvas);
        renderDiagram(canvas, parseMermaid(source), { compact: true });
      }

      function appendTextValue(parent, value) {
        var text = value == null ? "" : String(value);
        var sources = mermaidSources(text);
        if (sources.length) {
          sources.forEach(function (source) {
            appendMermaid(parent, source);
          });
          var prose = proseWithoutMermaid(text);
          if (prose) {
            var node = document.createElement("span");
            node.textContent = prose;
            parent.appendChild(node);
          }
          return;
        }
        var span = document.createElement("span");
        span.textContent = text;
        parent.appendChild(span);
      }

      function appendObject(parent, obj) {
        var dl = document.createElement("dl");
        Object.keys(obj).forEach(function (key) {
          var dt = document.createElement("dt");
          dt.textContent = labelFor(key);
          var dd = document.createElement("dd");
          appendValue(dd, key, obj[key], null);
          dl.appendChild(dt);
          dl.appendChild(dd);
        });
        parent.appendChild(dl);
      }

      function appendList(parent, key, items, map) {
        var ul = document.createElement("ul");
        items.forEach(function (item) {
          var li = document.createElement("li");
          if (key === "entry_points" && typeof item === "string") {
            li.textContent = item;
            if (isStale(map, item)) li.className = "stale";
          } else if (key === "related_features") {
            var slug = relatedSlug(item);
            if (slug && maps()[slug]) {
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "related";
              btn.textContent = String(item);
              btn.addEventListener("click", function () {
                select(slug);
              });
              li.appendChild(btn);
            } else {
              li.textContent = item == null ? "" : String(item);
            }
          } else if (item !== null && typeof item === "object") {
            appendValue(li, key, item, map);
          } else {
            appendValue(li, key, item, map);
          }
          ul.appendChild(li);
        });
        parent.appendChild(ul);
      }

      function appendValue(parent, key, value, map) {
        if (value == null) {
          appendTextValue(parent, "");
          return;
        }
        if (Array.isArray(value)) {
          appendList(parent, key, value, map);
          return;
        }
        if (typeof value === "object") {
          appendObject(parent, value);
          return;
        }
        appendTextValue(parent, value);
      }

      function searchQuery() {
        return (searchEl && searchEl.value || "").replace(/^\s+|\s+$/g, "").toLowerCase();
      }

      function matchesSearch(slug, map, q) {
        if (!q) return true;
        var name = (map.feature_name || "").toLowerCase();
        var purpose = (map.purpose || "").toLowerCase();
        return slug.toLowerCase().indexOf(q) !== -1
          || name.indexOf(q) !== -1
          || purpose.indexOf(q) !== -1;
      }

      function renderSidebar() {
        while (slugList.firstChild) slugList.removeChild(slugList.firstChild);
        var q = searchQuery();
        var shown = 0;
        (data.slugs || []).forEach(function (slug) {
          var map = maps()[slug] || {};
          if (!matchesSearch(slug, map, q)) return;
          shown += 1;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "slug-btn";
          btn.setAttribute("aria-current", slug === data.selected ? "true" : "false");
          btn.textContent = map.feature_name || slug;
          btn.addEventListener("click", function () {
            select(slug);
          });
          slugList.appendChild(btn);
        });
        if (sidebarEmpty) {
          sidebarEmpty.hidden = shown > 0 || !(data.slugs || []).length;
        }
      }

      function renderDetail(map) {
        heading.textContent = map.feature_name || map.slug || "";
        slugLine.textContent = map.slug || "";
        while (fieldsEl.firstChild) fieldsEl.removeChild(fieldsEl.firstChild);
        (map.fields || []).forEach(function (field) {
          var wrap = document.createElement("div");
          var dt = document.createElement("dt");
          dt.textContent = labelFor(field.key);
          var dd = document.createElement("dd");
          appendValue(dd, field.key, field.value, map);
          wrap.appendChild(dt);
          wrap.appendChild(dd);
          fieldsEl.appendChild(wrap);
        });
      }

      function snapshotGraph() {
        var graph = data.graph || {};
        var seen = {};
        var nodes = [];
        function addNode(id) {
          if (!id || seen[id]) return;
          seen[id] = true;
          var map = maps()[id] || {};
          nodes.push({
            id: id,
            label: map.feature_name || id,
            missing: !maps()[id]
          });
        }
        (graph.nodes || []).forEach(addNode);
        (graph.edges || []).forEach(function (edge) {
          addNode(edge.from);
          addNode(edge.to);
        });
        var parsed = parseMermaid(graph.mermaid || "");
        parsed.nodes.forEach(function (node) { addNode(node.id); });
        var edges = [];
        function addEdge(from, to) {
          if (!from || !to) return;
          var i;
          for (i = 0; i < edges.length; i += 1) {
            if (edges[i].from === from && edges[i].to === to) return;
          }
          addNode(from);
          addNode(to);
          edges.push({ from: from, to: to });
        }
        (graph.edges || []).forEach(function (edge) {
          addEdge(edge.from, edge.to);
        });
        parsed.edges.forEach(function (edge) {
          addEdge(edge.from, edge.to);
        });
        return {
          direction: parsed.direction || "LR",
          nodes: nodes,
          edges: edges
        };
      }

      function renderGraph() {
        renderDiagram(graphCanvas, snapshotGraph(), {
          selected: data.selected,
          onNodeClick: function (id) {
            select(id);
          }
        });
      }

      function render() {
        var slugs = data.slugs || [];
        if (searchEl) searchEl.hidden = !slugs.length;
        if (searchLabel) searchLabel.hidden = !slugs.length;
        if (!slugs.length) {
          emptyEl.hidden = false;
          detailEl.hidden = true;
          graphPanel.hidden = true;
          if (sidebarEmpty) sidebarEmpty.hidden = true;
          while (slugList.firstChild) slugList.removeChild(slugList.firstChild);
          return;
        }
        emptyEl.hidden = true;
        detailEl.hidden = false;
        graphPanel.hidden = false;
        renderSidebar();
        var selected = data.selected && maps()[data.selected]
          ? maps()[data.selected]
          : maps()[slugs[0]];
        if (selected) renderDetail(selected);
        renderGraph();
      }

      function select(slug) {
        if (!maps()[slug]) return;
        data.selected = slug;
        render();
        heading.focus();
      }

      if (searchEl) {
        searchEl.addEventListener("input", function () {
          renderSidebar();
        });
      }

      render();
    })();
  </script>
</body>
</html>
