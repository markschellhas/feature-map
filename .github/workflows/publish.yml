name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/feature-map-cli/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/feature-map-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --check bin/feature-map.js && node --check scripts/postinstall.js && node --check scripts/python.js
      # Do not pass registry-url to setup-node: it writes a dummy
      # NODE_AUTH_TOKEN that makes npm skip OIDC trusted publishing.
      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          echo "oidc_url=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "oidc_tok=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub did not expose an OIDC request URL (need id-token: write)"
            exit 1
          fi
          npm publish --access public --loglevel verbose
